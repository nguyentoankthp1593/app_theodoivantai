name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cai thu vien
        run: npm install

      - name: Tao project Android
        run: npx cap add android

      - name: Dong bo giao dien web vao Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tai file APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyVanTai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
