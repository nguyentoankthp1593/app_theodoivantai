/* Excel: add both login user and human-readable executor names. */
async function exportTransportExcel(rows){
  if(!rows||!rows.length){toast('Không có dữ liệu để xuất Excel.',true);return;}if(!window.ExcelJS){toast('Không tải được thư viện Excel.',true);return;}
  try{const wb=new ExcelJS.Workbook();wb.creator='Quản lý vận tải';wb.created=new Date();const ws=wb.addWorksheet('Chi tiết chuyến',{views:[{state:'frozen',ySplit:1}]});
  const headers=['Mã chuyến','Ngày chạy','Tuyến đường','Nhà máy','Biển số','Loại xe','Lái xe / User','Tên lái xe','User người điều xe','Tên người điều xe','Người tạo','Tên người tạo','Trạng thái','Giờ đến nhà máy','Giờ hạ xong GPS','Điểm trả hàng','Giờ trả hàng','Ngày trả hàng','Số giờ chạy','Đóng/trả 2 điểm','Số tờ khai','CP hải quan + kho bãi','CP bốc vác/phân loại/vé Nội Bài','CP in chứng từ','Phí khác','CP sửa chữa xe','Số lít dầu','Tiền dầu','Đơn giá gốc','Đơn giá điều chỉnh','Doanh thu','Tổng chi phí trực tiếp','Lợi nhuận trực tiếp','Tỷ suất lợi nhuận','Lý do điều chỉnh','Ghi chú','Người duyệt','Tên người duyệt'];ws.addRow(headers);
  rows.forEach(t=>{const rev=opsTripRevenue(t),cost=opsTripCost(t),profit=opsTripProfit(t);ws.addRow([t.trip_code,t.trip_date,t.route_name,t.plant_name,t.plate,t.vehicle_type,t.driver_code,accountDisplay(t.driver_code),t.dispatcher_code,accountDisplay(t.dispatcher_code),t.created_by,accountDisplay(t.created_by),opsStatusLabel(t),t.arrival_time,t.gps_unload_time,t.delivery_point,t.return_time,t.return_date,t.duration_hours,t.two_point_count,t.customs_declaration,t.cost_customs_warehouse,t.cost_loading_sorting_airport,t.cost_print_docs,t.other_cost,t.repair_cost,t.fuel_liters,t.fuel_cost,t.base_price,t.adjusted_price,rev,cost,profit,rev&&profit!=null?profit/rev:null,t.adjustment_reason,t.driver_notes||t.review_note,t.approved_by,accountDisplay(t.approved_by)]);});
  ws.getRow(1).height=34;ws.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF126B57'}};c.alignment={vertical:'middle',horizontal:'center',wrapText:true};});ws.columns.forEach(c=>c.width=18);ws.autoFilter={from:'A1',to:`AL1`};for(let r=2;r<=ws.rowCount;r++){ws.getCell(r,34).numFmt='0.00%';[22,23,24,25,26,28,29,30,31,32,33].forEach(c=>ws.getCell(r,c).numFmt='#,##0');ws.getCell(r,27).numFmt='#,##0.000';}
  const s=wb.addWorksheet('Tổng hợp theo xe');s.addRow(['Biển số','Loại xe','Số chuyến tài chính','Doanh thu','Tổng chi phí trực tiếp','Lợi nhuận trực tiếp','Tỷ suất lợi nhuận','Số lít dầu','Chuyến thiếu/chưa duyệt']);const groups=new Map();rows.forEach(t=>{const k=t.plate||'';const g=groups.get(k)||{plate:k,type:t.vehicle_type,n:0,rev:0,cost:0,liters:0,missing:0};if(['approved','closed'].includes(t.status)&&opsTripCost(t)!=null&&opsTripRevenue(t)!=null){g.n++;g.rev+=opsTripRevenue(t);g.cost+=opsTripCost(t);g.liters+=Number(t.fuel_liters)||0;}else g.missing++;groups.set(k,g);});[...groups.values()].forEach(g=>s.addRow([g.plate,g.type,g.n,g.rev,g.cost,g.rev-g.cost,g.rev?(g.rev-g.cost)/g.rev:null,g.liters,g.missing]));s.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF126B57'}};});s.columns.forEach(c=>c.width=22);for(let r=2;r<=s.rowCount;r++){[4,5,6].forEach(c=>s.getCell(r,c).numFmt='#,##0');s.getCell(r,7).numFmt='0.00%';s.getCell(r,8).numFmt='#,##0.000';}
  const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`bao-cao-van-tai-${todayStr()}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(`Đã xuất ${rows.length} chuyến.`);}catch(e){console.error(e);toast('Lỗi xuất Excel: '+(e.message||e),true);}
}


/* FIX: bổ sung màn hình Danh mục xe / nhà máy bị thiếu trong bản trước.
   Hàm này được renderAdminTab gọi ngay khi dựng tab quản trị; nếu thiếu,
   toàn bộ lần hiển thị dashboard cũng bị lỗi ReferenceError. */
function renderMasterData(){
  const root=$('admin-content');if(!root)return;
  const types=[...(A.types||[])].sort((a,b)=>String(a.vehicle_type||'').localeCompare(String(b.vehicle_type||''),'vi'));
  const drawRows=rows=>rows.length?`<div class="admin-table-scroll"><table class="tbl"><thead><tr><th>Tên loại xe</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${rows.map(x=>{const name=String(x.vehicle_type||''),active=x.is_active!==false;return `<tr><td><b>${esc(name)}</b></td><td>${esc(x.description||'—')}</td><td>${active?'<span class="admin-pill">Đang sử dụng</span>':'<span class="admin-pill off">Ngừng sử dụng</span>'}</td><td><button type="button" class="btn ${active?'tint':'green'} sm" data-master-active data-master-name="${esc(name)}" data-master-next="${active?'false':'true'}">${active?'Ngừng dùng':'Kích hoạt'}</button></td></tr>`;}).join('')}</tbody></table></div>`:opsTableEmpty('Chưa có loại xe. Hãy thêm loại xe ở biểu mẫu phía trên.');
  root.innerHTML=`${adminHead('Danh mục xe','Quản lý loại xe. Nhà máy là trường nhập tự do khi lập chuyến, không cần tạo danh mục nhà máy.','<button class="btn tint" id="master-refresh">↻ Đồng bộ</button>')}
    <section class="card"><div class="head"><div><h2>Thêm / cập nhật loại xe</h2><div class="sub">Nhập lại đúng tên loại xe để cập nhật mô tả hoặc kích hoạt lại.</div></div></div>
      <div class="admin-form-grid"><div class="field"><label>Tên loại xe *</label><input class="in" id="master-type-name" placeholder="VD: Xe tải 8 tấn"></div><div class="field"><label>Mô tả</label><input class="in" id="master-type-desc" placeholder="Tải trọng, loại thùng…"></div><button type="button" class="add-row-btn" id="master-type-save" title="Lưu loại xe">+</button></div><div class="err" id="master-type-msg"></div>
    </section>
    <section class="card flush"><div class="head pad"><div><h2>Danh sách loại xe</h2><div class="sub">${types.length} loại xe</div></div></div>${drawRows(types)}</section>`;
  $('master-refresh').onclick=loadAdmin;$('master-type-save').onclick=()=>saveMasterCatalog('type');
  ['master-type-name','master-type-desc'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')saveMasterCatalog('type');}));
  root.querySelectorAll('[data-master-active]').forEach(b=>b.onclick=()=>setMasterCatalogActive(b.dataset.masterName,b.dataset.masterNext==='true'));
}
async function saveMasterCatalog(kind){
  if(!me||me.role!=='admin')return toast('Chỉ Admin được sửa danh mục.',true);
  if(kind!=='type')return;
  const input=$('master-type-name'),descInput=$('master-type-desc'),msg=$('master-type-msg'),name=(input?.value||'').trim().replace(/\s+/g,' '),description=(descInput?.value||'').trim();
  if(msg)msg.textContent='';
  if(!name){if(msg)msg.textContent='Vui lòng nhập tên loại xe.';input?.focus();return;}
  const old=(A.types||[]).find(x=>String(x.vehicle_type||'').toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi'))||null;
  const payload={vehicle_type:name,description:description||(old?.description)||null,is_active:true};
  const btn=$('master-type-save');if(btn){btn.disabled=true;btn.textContent='…';}
  try{const {error}=await sb.from('vehicle_types').upsert(payload,{onConflict:'vehicle_type'});if(error)throw error;await opsLog(old?'update_catalog':'create_catalog','vehicle_types',name,old,payload);input.value='';descInput.value='';A.catalogSubTab='vehicles';A.tab='catalogs';toast(old?'Đã cập nhật danh mục.':'Đã thêm danh mục.');await loadAdmin();}
  catch(e){if(msg)msg.textContent=dbError(e);else toast(dbError(e),true);}
  finally{if(btn){btn.disabled=false;btn.textContent='+';}}
}
async function setMasterCatalogActive(name,active){
  if(!me||me.role!=='admin')return toast('Chỉ Admin được sửa danh mục.',true);
  const old=(A.types||[]).find(x=>String(x.vehicle_type)===String(name))||null;
  try{const {error}=await sb.from('vehicle_types').update({is_active:active}).eq('vehicle_type',name);if(error)throw error;await opsLog(active?'activate_catalog':'deactivate_catalog','vehicle_types',name,old,{vehicle_type:name,is_active:active});A.catalogSubTab='vehicles';A.tab='catalogs';toast(active?'Đã kích hoạt danh mục.':'Đã ngừng sử dụng danh mục.');await loadAdmin();}
  catch(e){toast(dbError(e),true);}
}

/* Hiển thị lý do Admin yêu cầu bổ sung cho tài khoản lái xe. */
function opsReviewNoteBlock(t){
  const note=opsReviewNoteText(t);
  if(!note)return '';
  const returned=opsIsReturnedAfterApproval(t);
  return `<section class="notice warn" role="status" style="margin:0 0 14px;white-space:pre-wrap"><strong>${returned?'CHUYẾN ĐÃ ĐƯỢC ADMIN RETURN SAU DUYỆT / CHỐT — CẦN SỬA':'YÊU CẦU BỔ SUNG TỪ ADMIN'}</strong><div style="margin-top:7px"><b>${returned?'Lý do Admin RETURN:':'Nội dung cần bổ sung:'}</b> ${esc(note)}</div><div class="admin-muted" style="margin-top:7px">${returned?'Admin đã thu hồi trạng thái duyệt/chốt trước đó. Vui lòng sửa đúng nội dung trên rồi gửi lại báo cáo; chuyến chỉ được tính tài chính sau khi Admin duyệt lại.':'Vui lòng kiểm tra nội dung trên, cập nhật chuyến và gửi báo cáo lại.'}</div></section>`;
}

</script>
